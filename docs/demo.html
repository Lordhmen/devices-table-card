:lan-disconnect":"M4,1C2.89,1 2,1.89 2,3V7C2,8.11 2.89,9 4,9H1V11H13V9H10C11.11,9 12,8.11 12,7V3C12,1.89 11.11,1 10,1H4M4,3H10V7H4V3M14,13C12.89,13 12,13.89 12,15V19C12,20.11 12.89,21 14,21H11V23H23V21H20C21.11,21 22,20.11 22,19V15C22,13.89 21.11,13 20,13H14M3.88,13.46L2.46,14.88L4.59,17L2.46,19.12L3.88,20.54L6,18.41L8.12,20.54L9.54,19.12L7.41,17L9.54,14.88L8.12,13.46L6,15.59L3.88,13.46M14,15H20V19H14V15Z","mdi:lan":"M10,2C8.89,2 8,2.89 8,4V7C8,8.11 8.89,9 10,9H11V11H2V13H6V15H5C3.89,15 3,15.89 3,17V20C3,21.11 3.89,22 5,22H9C10.11,22 11,21.11 11,20V17C11,15.89 10.11,15 9,15H8V13H16V15H15C13.89,15 13,15.89 13,17V20C13,21.11 13.89,22 15,22H19C20.11,22 21,21.11 21,20V17C21,15.89 20.11,15 19,15H18V13H22V11H13V9H14C15.11,9 16,8.11 16,7V4C16,2.89 15.11,2 14,2H10M10,4H14V7H10V4M5,17H9V20H5V17M15,17H19V20H15V17Z","mdi:circle":"M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"};

    _r() {
      const d = MDI[this.getAttribute("icon")] || "";
      this.style.display = "inline-flex";
      this.innerHTML = '<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:currentColor"><path d="' + d + '"/></svg>';

<body>
<div id="cards"></div>
<script>
const M = 60000, H = 3600000;
const ago = (ms) => new Date(NOW - ms).toISOString();
const KNOWN = "izvestnoe_ustroistvo";

// Вымышленная домашняя сеть
const wifi = [
  ["Чайник", "A4:CF:12:3B:7E:10", "192.168.1.31", "Home 2.4", 1, 1, true],
  ["Кондиционер", "84:F3:EB:20:41:5C", "192.168.1.32", "Home 2.4", 1, 1, true],
  ["Робот-пылесос", "B0:4A:39:72:0D:AE", "192.168.1.40", "Home 2.4", 1, 1],
  ["Телевизор", "C8:08:E9:55:13:02", "192.168.1.50", "Home 5G", 1, 1],
  ["Умная колонка", "6C:5A:B0:9E:31:44", "192.168.1.51", "Home 5G", 1, 1],
  ["Ноутбук", "3C:22:FB:18:6A:9D", "192.168.1.60", "Home 5G", 1, 1],
  ["Телефон", "DA:41:7F:0C:58:21", "192.168.1.61", "Home 5G", 1, 0],
  ["Розетка на балконе", "48:3F:DA:6E:02:B7", "192.168.1.33", "Home 2.4", 1, 1],
  ["ESP-датчик CO2", "EC:62:60:91:AF:30", "", "Home 2.4", 1, 1],
  ["Планшет", "F0:18:98:4C:2E:71", "192.168.1.62", "Home 5G", 0, 1, false, 2 * H + 14 * M],
  ["espressif", "24:0A:C4:5D:19:E8", "192.168.1.47", "Home 2.4", 1, 0],
  ["7A:11:C0:84:E5:2F", "7A:11:C0:84:E5:2F", "192.168.1.104", "Home 5G", 1, 0],
  ["Принтер", "00:26:AB:3F:7C:01", "192.168.1.70", "Home 2.4", 0, 0, false, 26 * H],
];
const lan = [
  ["Роутер (WAN)", "50:FF:20:11:A2:3C", "192.168.0.2", "LAN2", 1, 1],
  ["Сервер Home Assistant", "00:E0:4C:68:01:9B", "192.168.0.10", "LAN1", 1, 1],
  ["NAS", "00:11:32:AF:42:07", "192.168.0.20", "LAN1", 1, 1],
  ["00:1E:06:4A:3B:C2", "00:1E:06:4A:3B:C2", "192.168.0.35", "LAN3", 1, 0],
];
const hass = {
  config: { time_zone: "Asia/Yekaterinburg" },
  user: { is_admin: true },
  states: {}, entities: {}, devices: {},
  async callWS() { return { labels: [] }; },
};
let n = 0;
for (const [name, mac, ip, ssid, on, known, reserved, off] of wifi) {
  const id = "device_tracker.wifi_" + (++n);
  hass.states[id] = { state: on ? "home" : "not_home", last_changed: ago(off || 3 * H + n * 7 * M),
    attributes: { friendly_name: name, mac, ip: ip && !reserved ? ip : "Unknown IP", ssid, connection_type: "wireless" } };
  hass.entities[id] = { platform: "openwrt_ubus", labels: known ? [KNOWN] : [] };
}
for (const [name, mac, ip, port, on, known] of lan) {
  const id = "device_tracker.lan_" + (++n);
  hass.states[id] = { state: on ? "home" : "not_home", last_changed: ago(5 * H),
    attributes: { friendly_name: name, mac, ip, port, connection_type: "wired" } };
  hass.entities[id] = { platform: "mqtt", labels: known ? [KNOWN] : [] };
}
// IP из DHCP-резервации для устройств без аренды
hass.states["sensor.dhcp_reservations"] = { state: "2", last_changed: ago(H), attributes: { hosts: {
  "A4:CF:12:3B:7E:10": { ip: "192.168.1.31", name: "kettle" },
  "84:F3:EB:20:41:5C": { ip: "192.168.1.32", name: "ac" },
} } };

// Доступность: устройства (вымышленные), сенсор со списком офлайн и сущности для плиток
const did = (p, i) => (p + String(i).padStart(2, "0")).padEnd(32, "0");
const ESP = ["Водонагреватель", "Тёплый пол кухня", "Тёплый пол ванная", "Котёл", "Счётчик воды", "Реле насоса", "Датчик CO2 детская",
  "Метеостанция", "Ворота", "Полив газона", "Свет крыльцо", "Свет гараж", "Вентиляция", "Датчик дыма", "Бойлер гостевой"];
const ZB = ["Датчик протечки в ванной", "Датчик протечки на кухне", "Датчик двери входной", "Датчик окна спальни", "Кнопка у кровати",
  "Термометр спальня", "Термометр детская", "Термометр улица", "Датчик движения коридор", "Датчик движения холл", "Розетка чайника",
  "Розетка ТВ", "Реле света холл", "Реле света кухня", "Выключатель гостиная", "Штора спальня", "Штора гостиная", "Клапан воды",
  "Датчик вибрации", "Датчик освещённости"];
ESP.forEach((n, i) => { hass.devices[did("e5", i)] = { name: n }; hass.entities["sensor.esp_" + i] = { platform: "esphome", device_id: did("e5", i) }; });
ZB.forEach((n, i) => {
  const id = "sensor.zb_" + i + "_last_seen";
  hass.devices[did("2b", i)] = { name: n, labels: i === 19 ? ["ne_otslezhivat_dostupnost"] : [] };
  hass.states[id] = { state: ago(M) };
  hass.entities[id] = { platform: "mqtt", device_id: did("2b", i) };
});
hass.states["sensor.offline_devices"] = { state: "3", last_changed: ago(H), attributes: { devices: [
  { key: did("e5", 0), name: "Водонагреватель", kind: "ESPHome", since: ago(9 * H + 36 * M) },
  { key: did("2b", 0), name: "Датчик протечки в ванной", kind: "Zigbee", since: ago(27 * H) },
  { key: "device_tracker.wifi_10", name: "Планшет", kind: "Wi-Fi", since: ago(2 * H + 14 * M) },
] } };

const view = P.get("view") || "network";
const card = document.createElement("devices-table-card");
card.setConfig(view === "network" ? {
  mode: "network", title: "Сетевые устройства", icon: "mdi:lan",
  platforms: ["openwrt_ubus"], include: ["device_tracker.lan_*"], reservations_entity: "sensor.dhcp_reservations",
} : {
  mode: "availability", title: "Доступность устройств", icon: "mdi:lan-disconnect", entity: "sensor.offline_devices",
  show_all: view === "all",
  sources: [
    { name: "ESPHome", platform: "esphome" },
    { name: "Zigbee", include: "sensor.*_last_seen" },
    { name: "Сеть", kinds: ["Wi-Fi", "LAN"], label: KNOWN, domain: "device_tracker", count: "entities" },
  ],
});
document.getElementById("cards").appendChild(card);
card.hass = hass;
</script>
